version: '3'

vars:
  PLUGINS:
    sh: find plugins -mindepth 1 -maxdepth 1 -type d | sort
  TESTABLE:
    sh: find plugins -mindepth 2 -maxdepth 2 -name Taskfile.yml -exec dirname {} \; | sort

tasks:
  default:
    desc: Validate manifests, run every plugin's tests and check that changed plugins were bumped
    cmds:
      - task: validate
      - task: test
      - task: check-release

  validate:
    desc: Validate the marketplace catalog and every plugin manifest
    silent: true
    cmds:
      # A version mismatch between plugin.json and its catalog entry is only a warning upstream; treat it as an error.
      - |
        out=$(claude plugin validate . 2>&1) || { echo "$out"; exit 1; }
        echo "$out"
        if echo "$out" | grep -q 'Entry declares version'; then
          echo "task validate: a plugin.json version differs from its marketplace.json entry" >&2; exit 1
        fi
      - for: { var: PLUGINS }
        cmd: claude plugin validate {{.ITEM}}

  test:
    desc: Run each plugin's own `task test` with the tools pinned in its mise.toml
    cmds:
      - for: { var: TESTABLE }
        cmd: mise -C {{.ITEM}} exec -- task test

  check-release:
    desc: Fail when a plugin's shipped files changed since the tag of its current version
    cmds:
      - .claude/skills/release-plugin/check-release
