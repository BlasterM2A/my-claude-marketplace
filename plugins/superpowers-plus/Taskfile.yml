version: '3'

tasks:
  test:
    desc: Lint the shell scripts and run all tests
    cmds:
      - task: lint
      - task: test:bash
      - task: test:node
  lint:
    desc: Run shellcheck on the shell scripts
    cmds:
      - shellcheck scripts/lanes scripts/merge-queue scripts/preflight
  test:bash:
    desc: Run bats tests for the shell scripts
    cmds:
      - bats test/
  test:node:
    desc: Run node tests for the graph validator and the workflow
    cmds:
      - node --test "test/**/*.test.mjs"
